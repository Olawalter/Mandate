# Two required jobs run on every push and pull request: the contract (GenVM linter + direct-mode
# tests) and the frontend (typecheck, lint, tests, production build). The live StudioNet suite
# takes about 25 minutes of real consensus rounds on a shared public network and edits the demo
# policy page with git pushes, so it runs only when started by hand and never blocks anything.
name: ci

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      integration:
        description: "Also run the live StudioNet integration suite (~25 min, skips the git-push arc)"
        type: boolean
        default: false

jobs:
  contract:
    name: contract - genvm-lint + direct tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/genvm-linter
            ~/.cache/gltest-direct
          key: genvm-bundle-v0.3.0-rc7
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      # gltest 0.29.2 asks for an asset name the current GenVM releases no longer publish;
      # seed both caches with the verified bundle first.
      - run: python scripts/fetch_genvm_bundle.py
      - run: genvm-lint check contracts/mandate.py --json
      - run: python -m pytest tests/direct -v

  frontend:
    name: frontend - typecheck, lint, tests, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_APP_ENV: test
      NEXT_PUBLIC_GENLAYER_NETWORK: studionet
      NEXT_PUBLIC_GENLAYER_CHAIN: "61999"
      NEXT_PUBLIC_MANDATE_CONTRACT: "0x5344bEae1A09c674831B174eD6BD077a5d7e58ba"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  integration:
    name: integration on StudioNet (manual, non-blocking)
    if: github.event_name == 'workflow_dispatch' && inputs.integration
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 60
    env:
      SKIP_INTEGRATION: "0"
      MANDATE_DEMO_PUSH: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m pytest tests/integration -v -s
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-e2e
          path: docs/live-e2e.json
          if-no-files-found: ignore
